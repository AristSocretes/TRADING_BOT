[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-forex-trading-bot"
version = "0.1.0"
description = "Reinforcement-learning crypto trading bot (Binance data)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.26",
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
    "torch>=2.1",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "loguru>=0.7",
]

[tool.setuptools.packages.find]
include = ["bot*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [".venv", "bot.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]
